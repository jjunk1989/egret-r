<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flappy Bird — Egret Engine R</title>
  <style>
    * { margin: 0; padding: 0; }
    body { background: #87ceeb; overflow: hidden; }
    #game-container { width: 100vw; height: 100vh; }
